<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescription Analysis — MediCompare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/analysis.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="container analysis-shell">

    <div class="analysis-head">
      <div class="analysis-head-top">
        <div>
          <span class="eyebrow">Step 2 of 4</span>
          <h1>Review what we found</h1>
        </div>
        <span class="badge badge-neutral" id="demo-flag" style="display:none;">Demo data</span>
      </div>
      <p>Check each medicine below. Low-confidence fields are flagged — edit anything that looks off before continuing.</p>
    </div>

    <div id="medicines-mount">
      <div class="card state-block"><div class="spinner"></div>Loading extracted medicines…</div>
    </div>

    <button class="card add-medicine-card" id="show-add-form" style="display:none; width:100%; cursor:pointer;">
      <span class="add-medicine-toggle">＋ Add medicine manually</span>
    </button>

    <div class="card" id="add-medicine-form-card" style="display:none;">
      <h4>Add a medicine</h4>
      <form id="add-medicine-form">
        <div class="medicine-fields">
          <div class="field"><label>Medicine name</label><input type="text" id="new-medicine-name" required placeholder="e.g. Pantop 40"></div>
          <div class="field"><label>Salt / active ingredient</label><input type="text" id="new-medicine-salt" placeholder="e.g. Pantoprazole"></div>
          <div class="field"><label>Strength</label><input type="text" id="new-medicine-strength" placeholder="e.g. 40 mg"></div>
          <div class="field"><label>Dosage</label><input type="text" id="new-medicine-dosage" placeholder="e.g. 1 tablet before breakfast"></div>
        </div>
        <div class="field"><label>Duration</label><input type="text" id="new-medicine-duration" placeholder="e.g. 5 days"></div>
        <div class="flex gap-3">
          <button type="submit" class="btn btn-primary">Add medicine</button>
          <button type="button" class="btn btn-ghost" id="cancel-add-medicine">Cancel</button>
        </div>
      </form>
    </div>

    <div class="analysis-footer-actions">
      <a href="#" class="btn btn-outline" id="back-link">Back to scan</a>
      <button class="btn btn-accent btn-lg" id="verify-continue-btn">Verify & continue</button>
    </div>

  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script src="js/analysis.js"></script>
</body>
</html>
