<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — MediCompare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card-head">
        <h1>Create your account</h1>
        <p>Compare prices and track savings for yourself or someone you care for.</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="register-form" novalidate>
        <div class="role-toggle" role="radiogroup" aria-label="Account type">
          <input type="radio" name="role" id="role-patient" value="patient" checked>
          <label for="role-patient" id="label-patient" class="active">I'm a patient</label>
          <input type="radio" name="role" id="role-caregiver" value="caregiver">
          <label for="role-caregiver" id="label-caregiver">I'm a caregiver</label>
        </div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required placeholder="Anjali Sharma">
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
          <div class="field-hint">Use at least 6 characters. We store this securely — never in plain text.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Create account</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
