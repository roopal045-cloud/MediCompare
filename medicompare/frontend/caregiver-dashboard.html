<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caregiver Dashboard — MediCompare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="container dashboard-shell">

    <div class="dashboard-welcome">
      <div>
        <h1 id="welcome-heading">Caregiver dashboard</h1>
        <p>Manage prescriptions and savings for the people you care for.</p>
      </div>
    </div>

    <div class="dashboard-grid" id="stats-grid">
      <div class="card stat-card"><span class="stat-value">—</span><span class="stat-label">Patients managed</span></div>
      <div class="card stat-card"><span class="stat-value">—</span><span class="stat-label">Prescriptions analyzed</span></div>
      <div class="card stat-card stat-accent"><span class="stat-value">—</span><span class="stat-label">Total potential savings</span></div>
      <div class="card stat-card"><span class="stat-value">—</span><span class="stat-label">Pending verification</span></div>
    </div>

    <div class="dashboard-section-title">
      <h3 style="margin:0;">Patients</h3>
    </div>
    <div class="patients-grid" id="patients-grid">
      <div class="state-block"><div class="spinner"></div>Loading…</div>
    </div>

    <div class="dashboard-section-title">
      <h3 style="margin:0;">Recent savings history</h3>
    </div>
    <div class="card" id="recent-savings">
      <div class="state-block"><div class="spinner"></div>Loading…</div>
    </div>

  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<!-- Add patient modal -->
<div class="modal-overlay" id="add-patient-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 style="margin:0;">Add a patient profile</h3>
      <button class="modal-close" id="close-modal-btn" aria-label="Close">✕</button>
    </div>
    <form id="add-patient-form">
      <div class="field">
        <label for="patient-name">Name</label>
        <input type="text" id="patient-name" required placeholder="e.g. Mother, Ramesh Kumar">
      </div>
      <div class="field">
        <label for="patient-age">Age</label>
        <input type="number" id="patient-age" min="0" max="120" placeholder="e.g. 62">
      </div>
      <div class="field">
        <label for="patient-relationship">Relationship</label>
        <select id="patient-relationship">
          <option value="Mother">Mother</option>
          <option value="Father">Father</option>
          <option value="Spouse">Spouse</option>
          <option value="Child">Child</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Add patient</button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
