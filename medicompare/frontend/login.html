<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — MediCompare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card-head">
        <h1>Welcome back</h1>
        <p>Log in to view your prescriptions and savings.</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
      </form>

      <p class="auth-foot">Don't have an account? <a href="register.html">Register for free</a></p>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
